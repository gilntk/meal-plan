# Netlify settings. The site is plain static files, so there's no build step.
[build]
  publish = "."

# Always check for a fresh service worker so updates reach the phone.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
